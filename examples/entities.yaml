---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: example-domain
  description: Example business domain
spec:
  owner: guests
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: examples
  description: Customer-facing example platform
spec:
  owner: guests
  domain: example-domain
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: payments
  description: Handles payment processing
spec:
  owner: guests
  domain: example-domain
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-website
  description: Customer-facing web frontend
spec:
  type: website
  lifecycle: experimental
  owner: guests
  system: examples
  consumesApis:
    - example-grpc-api
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-backend
  description: Core backend API service
spec:
  type: service
  lifecycle: experimental
  owner: guests
  system: examples
  providesApis:
    - example-grpc-api
  consumesApis:
    - payment-api
  dependsOn:
    - resource:default/example-database
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: example-database
  description: Primary PostgreSQL data store
spec:
  type: database
  owner: guests
  system: examples
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: payment-service
  description: Processes payments via external gateway
spec:
  type: service
  lifecycle: experimental
  owner: guests
  system: payments
  providesApis:
    - payment-api
---
apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: logistics-domain
  description: Logistics and fulfillment domain
spec:
  owner: guests
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: warehouse
  description: Warehouse management system
spec:
  owner: guests
  domain: logistics-domain
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: shipping
  description: Shipping and delivery tracking
spec:
  owner: guests
  domain: logistics-domain
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: warehouse-service
  description: Manages inventory and stock levels
spec:
  type: service
  lifecycle: experimental
  owner: guests
  system: warehouse
  providesApis:
    - inventory-api
  consumesApis:
    - payment-api
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: warehouse-db
  description: Warehouse inventory database
spec:
  type: database
  owner: guests
  system: warehouse
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: shipping-service
  description: Tracks shipments and deliveries
spec:
  type: service
  lifecycle: experimental
  owner: guests
  system: shipping
  consumesApis:
    - inventory-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: inventory-api
  description: REST API for inventory queries
spec:
  type: openapi
  lifecycle: experimental
  owner: guests
  system: warehouse
  definition: |
    openapi: 3.0.0
    info:
      title: Inventory API
      version: 1.0.0
    paths:
      /stock:
        get:
          summary: Get stock levels
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: example-grpc-api
  description: gRPC API for example platform
spec:
  type: grpc
  lifecycle: experimental
  owner: guests
  system: examples
  definition: |
    syntax = "proto3";
    service Exampler {
      rpc Example (ExampleMessage) returns (ExampleMessage) {};
    }
    message ExampleMessage {
      string example = 1;
    };
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: payment-api
  description: REST API for payment processing
spec:
  type: openapi
  lifecycle: experimental
  owner: guests
  system: payments
  definition: |
    openapi: 3.0.0
    info:
      title: Payment API
      version: 1.0.0
    paths:
      /pay:
        post:
          summary: Process payment
