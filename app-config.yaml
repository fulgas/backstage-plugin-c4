app:
  title: C4 Example App
  baseUrl: http://localhost:3000

organization:
  name: C4 Example

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']

  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'

auth:
  providers:
    guest: {}

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, Domain, API, Resource, Location]
  locations:
    # C4 example catalog — three domain files showcasing all C4 levels
    - type: file
      target: ../../examples/c4/retail.yaml
    - type: file
      target: ../../examples/c4/fulfillment.yaml
    - type: file
      target: ../../examples/c4/platform.yaml

    # Local example template
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

c4:
  schedule:
    frequency:
      minutes: 5
    timeout:
      minutes: 3
    initialDelay:
      seconds: 15
  dsl:
    annotation: c4/structurizr-path
    conventionPath: c4-model.dsl
